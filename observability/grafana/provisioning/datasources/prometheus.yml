apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: nettutos-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 5s

  - name: Tempo
    type: tempo
    uid: nettutos-tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      tracesToMetrics:
        datasourceUid: nettutos-prometheus
