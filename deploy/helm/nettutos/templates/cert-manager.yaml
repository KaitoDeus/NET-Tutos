{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled .Values.ingress.tls.certManager.createClusterIssuer }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.ingress.tls.clusterIssuer | default "letsencrypt-prod" }}
  labels:
    {{- include "nettutos.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ .Values.ingress.tls.certManager.acmeServer }}
    email: {{ .Values.ingress.tls.certManager.email }}
    privateKeySecretRef:
      name: {{ .Values.ingress.tls.clusterIssuer | default "letsencrypt-prod" }}-account-key
    solvers:
      - http01:
          ingress:
            class: {{ .Values.ingress.className }}
{{- end }}
