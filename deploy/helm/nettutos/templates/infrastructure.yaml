{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nettutos-postgres-init
  labels:
    {{- include "nettutos.labels" . | nindent 4 }}
data:
  01-init-databases.sql: |
    SELECT 'CREATE DATABASE {{ .Values.postgres.gamificationDatabase }}'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ .Values.postgres.gamificationDatabase }}')\gexec
    \connect {{ .Values.postgres.database }}
    CREATE EXTENSION IF NOT EXISTS vector;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nettutos-postgres
  labels:
    {{- include "nettutos.labels" . | nindent 4 }}
spec:
  serviceName: nettutos-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: nettutos-postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nettutos-postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init-sql, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init-sql
          configMap:
            name: nettutos-postgres-init
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
---
apiVersion: v1
kind: Service
metadata: { name: nettutos-postgres }
spec:
  selector: { app.kubernetes.io/name: nettutos-postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nettutos-redis }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: nettutos-redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: nettutos-redis } }
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--appendonly", "yes", "--maxmemory", {{ .Values.redis.maxMemory | quote }}, "--maxmemory-policy", "allkeys-lru"]
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: nettutos-redis }
spec:
  selector: { app.kubernetes.io/name: nettutos-redis }
  ports: [{ port: 6379, targetPort: 6379 }]
{{- end }}
{{- if .Values.rabbitmq.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nettutos-rabbitmq }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: nettutos-rabbitmq } }
  template:
    metadata: { labels: { app.kubernetes.io/name: nettutos-rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
---
apiVersion: v1
kind: Service
metadata: { name: nettutos-rabbitmq }
spec:
  selector: { app.kubernetes.io/name: nettutos-rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: management, port: 15672, targetPort: 15672 }
{{- end }}
{{- if .Values.kafka.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nettutos-kafka
  labels:
    {{- include "nettutos.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: nettutos-kafka } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nettutos-kafka }
    spec:
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 9092 }]
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://nettutos-kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: nettutos-kafka }
spec:
  selector: { app.kubernetes.io/name: nettutos-kafka }
  ports: [{ name: plaintext, port: 9092, targetPort: 9092 }]
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nettutos
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    {{- if .Values.ingress.tls.enabled }}
    nginx.ingress.kubernetes.io/ssl-redirect: {{ .Values.ingress.tls.sslRedirect | quote }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: {{ .Values.ingress.tls.sslRedirect | quote }}
    {{- if .Values.ingress.tls.hstsEnabled }}
    nginx.ingress.kubernetes.io/hsts: "true"
    {{- end }}
    {{- if .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nettutos-gateway
                port: { number: 8080 }
{{- end }}
