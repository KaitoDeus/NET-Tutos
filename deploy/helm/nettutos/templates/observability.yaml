{{- if .Values.prometheus.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nettutos-prometheus-config
  labels:
    {{- include "nettutos.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
      external_labels:
        platform: "net-tutos"
        environment: "kubernetes"
    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: "nettutos-web"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["nettutos-web:5000"]
      - job_name: "nettutos-gateway"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["nettutos-gateway:8080"]
      - job_name: "nettutos-coderunner"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["nettutos-coderunner:8080"]
      - job_name: "nettutos-gamification"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["nettutos-gamification:8080"]
      - job_name: "nettutos-aitutor"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["nettutos-aitutor:8080"]
      - job_name: "nettutos-catalog"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["nettutos-catalog:8080"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nettutos-prometheus
  labels:
    {{- include "nettutos.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: nettutos-prometheus } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nettutos-prometheus }
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time={{ .Values.prometheus.retention }}"
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: nettutos-prometheus-config
---
apiVersion: v1
kind: Service
metadata: { name: nettutos-prometheus }
spec:
  selector: { app.kubernetes.io/name: nettutos-prometheus }
  ports: [{ name: http, port: 9090, targetPort: 9090 }]
{{- end }}
{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nettutos-grafana-provisioning
  labels:
    {{- include "nettutos.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: nettutos-prometheus
        access: proxy
        url: http://nettutos-prometheus:9090
        isDefault: true
        editable: true
        jsonData:
          httpMethod: POST
          timeInterval: 5s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nettutos-grafana
  labels:
    {{- include "nettutos.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: nettutos-grafana } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nettutos-grafana }
    spec:
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 3000 }]
          env:
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Viewer" }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
      volumes:
        - name: datasources
          configMap:
            name: nettutos-grafana-provisioning
---
apiVersion: v1
kind: Service
metadata: { name: nettutos-grafana }
spec:
  selector: { app.kubernetes.io/name: nettutos-grafana }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
{{- end }}
