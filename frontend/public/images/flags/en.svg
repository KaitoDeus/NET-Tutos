<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="uk-circle">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
    <clipPath id="uk-diag">
      <path d="M256,256 H512 V512 Z M256,256 V512 H0 Z M256,256 H0 V0 Z M256,256 V0 H512 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#uk-circle)">
    <rect width="512" height="512" fill="#012169"/>
    <path d="M0,0 L512,512 M512,0 L0,512" stroke="#FFFFFF" stroke-width="64"/>
    <path d="M0,0 L512,512 M512,0 L0,512" clip-path="url(#uk-diag)" stroke="#C8102E" stroke-width="40"/>
    <path d="M256,0 V512 M0,256 H512" stroke="#FFFFFF" stroke-width="100"/>
    <path d="M256,0 V512 M0,256 H512" stroke="#C8102E" stroke-width="60"/>
  </g>
</svg>
