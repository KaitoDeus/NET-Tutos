<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Ngoại Tuyến | NET-Tutos</title>
    <link rel="icon" type="image/png" href="/images/csharp-logo.png" />
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: #0b0f19;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(239, 68, 68, 0.09) 0%, transparent 55%),
                radial-gradient(circle at 80% 85%, rgba(99, 102, 241, 0.05) 0%, transparent 45%);
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .offline-card {
            width: 100%;
            max-width: 440px;
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
            position: relative;
            overflow: hidden;
        }
        .offline-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ef4444, transparent);
        }
        .badge-offline {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #f87171;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            margin-bottom: 1.25rem;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #ef4444;
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .error-code {
            font-size: 5.25rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -3px;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #fca5a5 0%, #ef4444 50%, #f97316 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 8px 24px rgba(239, 68, 68, 0.25));
        }
        .error-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }
        .error-desc {
            font-size: 0.875rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 1.75rem;
        }
        .action-group {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.65rem 1.4rem;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 9999px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }
        .btn-retry {
            background: #ef4444;
            border: 1px solid #ef4444;
            color: #ffffff;
        }
        .btn-retry:hover {
            background: #dc2626;
            border-color: #dc2626;
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4);
        }
        .btn-home {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #334155;
            color: #cbd5e1;
        }
        .btn-home:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #475569;
            color: #ffffff;
            transform: translateY(-1px);
        }
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            display: inline-block;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="badge-offline">
            <span class="status-dot"></span>
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="currentColor" viewBox="0 0 16 16">
                <path d="M10.706 3.294A12.6 12.6 0 0 0 8 3C5.259 3 2.723 3.882.663 5.379a.485.485 0 0 0-.048.736.518.518 0 0 0 .668.05A11.448 11.448 0 0 1 8 4c.63 0 1.249.05 1.852.148zM8 6c-1.905 0-3.68.56-5.18 1.524a.5.5 0 0 0-.043.753.5.5 0 0 0 .678.04A9.467 9.467 0 0 1 8 7c.84 0 1.646.126 2.404.36zm.001 3c-.927 0-1.79.248-2.54.678l1.455 1.455c.34-.087.702-.133 1.085-.133.432 0 .84.058 1.226.166l1.238-1.238A7.472 7.472 0 0 0 8.001 9m-.65 4.542.848.848a.5.5 0 0 0 .707 0l.848-.848a.5.5 0 0 0 0-.707l-.848-.849-.848.849a.5.5 0 0 0 0 .707z"/>
                <path d="M14.854 1.146a.5.5 0 0 0-.708 0l-14 14a.5.5 0 1 0 .708.708l14-14a.5.5 0 0 0 0-.708"/>
            </svg>
            <span>Mất Kết Nối</span>
        </div>

        <div class="error-code">404</div>

        <h1 class="error-title">Không Thể Tải Trang</h1>
        <p class="error-desc">Trang chưa được lưu offline hoặc thiết bị đang không có Internet.</p>

        <div class="action-group">
            <button type="button" id="btnRetry" class="btn-action btn-retry" onclick="handleRetry()">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
                    <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
                </svg>
                <span>Thử lại</span>
            </button>
            <a href="/" class="btn-action btn-home">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"/>
                </svg>
                <span>Trang chủ</span>
            </a>
        </div>
    </div>

    <script>
        function handleRetry() {
            const btn = document.getElementById('btnRetry');
            if (btn) {
                btn.innerHTML = '<span class="spinner"></span><span>Đang thử lại...</span>';
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.85';
            }
            setTimeout(function() {
                window.location.reload();
            }, 400);
        }

        window.addEventListener('online', function() {
            const btn = document.getElementById('btnRetry');
            if (btn) {
                btn.innerHTML = '<span>Đã có mạng! Đang tải...</span>';
                btn.style.background = '#10b981';
                btn.style.borderColor = '#10b981';
            }
            setTimeout(function() {
                window.location.reload();
            }, 500);
        });
    </script>
</body>
</html>
