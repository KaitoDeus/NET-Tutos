services:
  # PostgreSQL 17 Database Service with pgvector Extension
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nettutos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nettutos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: "trust"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nettutos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 Distributed Cache (L2 Cache for Roslyn Sandbox, Catalog & SEO Sitemap)
  redis:
    image: redis:7-alpine
    container_name: nettutos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # RabbitMQ Message Broker for Event-Driven Microservices
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nettutos-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # RabbitMQ Management Web Dashboard
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Kafka 3.9 Event Streaming Platform (KRaft mode - no ZooKeeper)
  kafka:
    image: apache/kafka:latest
    container_name: nettutos-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservice: Roslyn Sandboxed Code Runner API
  coderunner:
    build:
      context: .
      dockerfile: src/Services/CodeRunner/NET-Tutos.CodeRunner.API/Dockerfile
    container_name: nettutos-coderunner
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5002:8080"

  # Microservice: Gamification & Retention API
  gamification:
    build:
      context: .
      dockerfile: src/Services/Gamification/NET-Tutos.Gamification.API/Dockerfile
    container_name: nettutos-gamification
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__PostgreSqlConnection=Host=postgres;Port=5432;Database=nettutos_gamification_db;Username=postgres;Password=postgres;Include Error Detail=true
      - RabbitMQ__Host=rabbitmq
      - UseInMemoryBus=false
    ports:
      - "5004:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Microservice: AI Tutor & Mock Technical Interview API
  aitutor:
    build:
      context: .
      dockerfile: src/Services/AiTutor/NET-Tutos.AiTutor.API/Dockerfile
    container_name: nettutos-aitutor
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5006:8080"

  # Microservice: Catalog & Assessment Certification API
  catalog:
    build:
      context: .
      dockerfile: src/Services/Catalog/NET-Tutos.Catalog.API/Dockerfile
    container_name: nettutos-catalog
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5008:8080"

  # ASP.NET Core 10 Web Application & BFF Engine
  web:
    build:
      context: .
      dockerfile: src/Presentation/Web/Dockerfile
    container_name: nettutos-web
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - DatabaseProvider=PostgreSql
      - ConnectionStrings__PostgreSqlConnection=Host=postgres;Port=5432;Database=nettutos_db;Username=postgres;Password=postgres
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=nettutos_db;Username=postgres;Password=postgres
      - ConnectionStrings__RedisConnection=redis:6379,abortConnect=false,connectTimeout=1500,syncTimeout=1000
      - Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command=Warning
      - Logging__LogLevel__System.Net.Http.HttpClient=Warning
      - Logging__LogLevel__Microsoft.AspNetCore.Antiforgery=Critical
      - Logging__LogLevel__Microsoft.AspNetCore.DataProtection=Error
      - DATAPROTECTION_KEYS_PATH=/app/.keys
      - Services__CodeRunner__Url=http://coderunner:8080
      - Services__Gamification__Url=http://gamification:8080
      - Services__AiTutor__Url=http://aitutor:8080
      - Services__Catalog__Url=http://catalog:8080
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__Enabled=true
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - Gemini__Model=${GEMINI_MODEL:-gemini-3.8-flash}
      - Gemini__Enabled=${GEMINI_ENABLED:-true}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "5001:5000"
    volumes:
      - dataprotection_keys:/app/.keys
    depends_on:
      postgres:
        condition: service_healthy

  # Microsoft YARP Reverse Proxy & API Gateway (Single External Ingress)
  gateway:
    build:
      context: .
      dockerfile: src/Gateways/Gateway/Dockerfile
    container_name: nettutos-gateway
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5000:8080"
    depends_on:
      - web
      - coderunner
      - gamification
      - aitutor
      - catalog

  # Prometheus Time-Series Metrics Collector (Scrapes Web, Gateway & Microservices /metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: nettutos-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - web
      - gateway

  # Grafana Observability Dashboards (Pre-provisioned Prometheus Datasource & NET-Tutos Overview)
  grafana:
    image: grafana/grafana:latest
    container_name: nettutos-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-nettutos2026}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
    driver: local
  dataprotection_keys:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
