services:
  # PostgreSQL 17 Database Service
  postgres:
    image: postgres:17-alpine
    container_name: nettutos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nettutos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: "trust"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nettutos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ASP.NET Core 10 Web Application & RESTful API Engine
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nettutos-web
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - DatabaseProvider=PostgreSql
      - ConnectionStrings__PostgreSqlConnection=Host=postgres;Port=5432;Database=nettutos_db;Username=postgres;Password=postgres;Include Error Detail=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=nettutos_db;Username=postgres;Password=postgres;Include Error Detail=true
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
