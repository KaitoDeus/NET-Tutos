services:
  # PostgreSQL 17 Database Service
  postgres:
    image: postgres:17-alpine
    container_name: nettutos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nettutos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: "trust"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nettutos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker for Event-Driven Microservices
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nettutos-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # RabbitMQ Management Web Dashboard
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservice: Roslyn Sandboxed Code Runner API
  coderunner:
    build:
      context: .
      dockerfile: src/Services/CodeRunner/NET-Tutos.CodeRunner.API/Dockerfile
    container_name: nettutos-coderunner
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5002:8080"

  # Microservice: Gamification & Retention API
  gamification:
    build:
      context: .
      dockerfile: src/Services/Gamification/NET-Tutos.Gamification.API/Dockerfile
    container_name: nettutos-gamification
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__PostgreSqlConnection=Host=postgres;Port=5432;Database=nettutos_db;Username=postgres;Password=postgres;Include Error Detail=true
      - RabbitMQ__Host=rabbitmq
      - UseInMemoryBus=false
    ports:
      - "5004:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ASP.NET Core 10 Web Application & BFF Engine
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nettutos-web
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - DatabaseProvider=PostgreSql
      - ConnectionStrings__PostgreSqlConnection=Host=postgres;Port=5432;Database=nettutos_db;Username=postgres;Password=postgres;Include Error Detail=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=nettutos_db;Username=postgres;Password=postgres;Include Error Detail=true
      - Services__CodeRunner__Url=http://coderunner:8080
      - Services__Gamification__Url=http://gamification:8080
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
