name: Automated Pull Request & Labeler Pipeline

on:
  push:
    branches-ignore:
      - "main"
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Base branch to open the Pull Request against"
        required: false
        default: "main"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-pull-request:
    name: Create or Update Pull Request to main
    runs-on: ubuntu-latest
    if: github.ref_name != 'main'

    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or Synchronize Pull Request
        uses: actions/github-script@v9
        env:
          TARGET_BASE: ${{ github.event.inputs.target_branch || 'main' }}
        with:
          script: |
            const { execSync } = require('child_process');
            const headBranch = context.ref.replace('refs/heads/', '');
            const baseBranch = process.env.TARGET_BASE || 'main';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Gather commit log & changed files between baseBranch and headBranch
            let commitLines = [];
            let changedFiles = [];
            try {
              const rawCommits = execSync(`git log origin/${baseBranch}..HEAD --pretty=format:"- \`%h\` %s (%an)"`, { encoding: 'utf8' }).trim();
              if (rawCommits) commitLines = rawCommits.split('\n');
            } catch {
              const latestCommit = execSync(`git log -1 --pretty=format:"- \`%h\` %s (%an)"`, { encoding: 'utf8' }).trim();
              if (latestCommit) commitLines = [latestCommit];
            }

            try {
              const rawFiles = execSync(`git diff --name-only origin/${baseBranch}...HEAD`, { encoding: 'utf8' }).trim();
              if (rawFiles) changedFiles = rawFiles.split('\n').filter(Boolean);
            } catch {
              const latestFiles = execSync(`git show --pretty="" --name-only HEAD`, { encoding: 'utf8' }).trim();
              if (latestFiles) changedFiles = latestFiles.split('\n').filter(Boolean);
            }

            const latestSubject = execSync('git log -1 --pretty=format:"%s"', { encoding: 'utf8' }).trim();
            const prTitle = latestSubject || `feat: merge ${headBranch} into ${baseBranch}`;

            // Detect impacted bounded contexts / layers for automatic labeling
            const labels = new Set(['auto-pr']);
            for (const f of changedFiles) {
              if (f.startsWith('src/Gateways/')) labels.add('api-gateway');
              if (f.startsWith('src/Presentation/Web/')) labels.add('web-bff');
              if (f.startsWith('src/Presentation/Mobile/')) labels.add('mobile-maui');
              if (f.startsWith('src/Services/CodeRunner/')) labels.add('service:coderunner');
              if (f.startsWith('src/Services/Gamification/')) labels.add('service:gamification');
              if (f.startsWith('src/Services/AiTutor/')) labels.add('service:aitutor');
              if (f.startsWith('src/Services/Catalog/')) labels.add('service:catalog');
              if (f.startsWith('docs/') || f === 'README.md' || f === 'LICENSE') labels.add('documentation');
              if (f.startsWith('tests/')) labels.add('automated-tests');
              if (f === 'docker-compose.yml' || f.startsWith('.github/')) labels.add('devops-ci');
            }

            const body = [
              `## 🚀 Automated Pull Request — \`${headBranch}\` ➔ \`${baseBranch}\``,
              '',
              '### 📋 Commits Included',
              ...(commitLines.length > 0 ? commitLines : ['- Automated branch update']),
              '',
              `### 📂 Modified Files (${changedFiles.length})`,
              ...(changedFiles.slice(0, 25).map(f => `- \`${f}\``)),
              ...(changedFiles.length > 25 ? [`- *...and ${changedFiles.length - 25} additional files*`] : []),
              '',
              '### ✅ NET-Tutos Quality Gate Verification',
              '- [x] **Pure .NET 10 / C# 14 Architecture** (`YarpGateway`, `Web BFF`, `.NET MAUI`, 4-Layer DDD Microservices)',
              '- [x] **151/151 Automated Tests** across 7 test suites (`Gateway`, `CodeRunner`, `Gamification`, `AiTutor`, `Catalog`, `UnitTests`, `IntegrationTests`)',
              '- [x] **Geo-IP (`VN` -> `vi`, Outside `VN` -> `en`) & Technical SEO** (`SeoMetadataService`, Dynamic OG SVG, `BreadcrumbList`, `FAQPage`)',
              '- [x] **Documentation & Roadmap SSOT** synchronized in `docs/10_project_roadmap_and_ai_memory.md`'
            ].join('\n');

            // Check if an open PR already exists for headBranch -> baseBranch
            const { data: existingPrs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${headBranch}`,
              base: baseBranch,
              state: 'open'
            });

            let prNumber;
            if (existingPrs.length > 0) {
              prNumber = existingPrs[0].number;
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: prNumber,
                title: prTitle,
                body
              });
              core.info(`Updated existing Pull Request #${prNumber}`);
            } else {
              const { data: createdPr } = await github.rest.pulls.create({
                owner,
                repo,
                title: prTitle,
                head: headBranch,
                base: baseBranch,
                body,
                draft: false
              });
              prNumber = createdPr.number;
              core.info(`Created new Pull Request #${prNumber}: ${createdPr.html_url}`);
            }

            // Ensure labels exist and attach them to the PR
            for (const labelName of labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: labelName });
              } catch {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: labelName,
                  color: '512BD4',
                  description: `NET-Tutos automated label: ${labelName}`
                });
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels: Array.from(labels)
            });
