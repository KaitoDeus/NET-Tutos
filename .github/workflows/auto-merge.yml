name: Automated PR Squash-Merge & Branch Cleanup

on:
  workflow_run:
    workflows: [".NET CI & Automated Testing Pipeline"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge-on-ci-success:
    name: Auto-Merge Verified PR & Delete Head Branch
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch != 'main' }}

    steps:
      - name: Merge Open Auto-PR & Clean Up Branch
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headBranch = context.payload.workflow_run.head_branch;

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${headBranch}`,
              base: 'main',
              state: 'open'
            });

            if (prs.length === 0) {
              core.info(`No open Pull Request found for branch '${headBranch}'.`);
              return;
            }

            for (const pr of prs) {
              const labelNames = pr.labels.map(l => l.name.toLowerCase());
              const isEligible = labelNames.includes('auto-pr') ||
                                 labelNames.includes('automerge') ||
                                 labelNames.includes('dependencies');

              if (!isEligible || pr.draft) {
                core.info(`Skipping PR #${pr.number} (draft=${pr.draft}, labels=[${labelNames.join(', ')}]).`);
                continue;
              }

              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  commit_title: `${pr.title} (#${pr.number})`
                });
                core.info(`Successfully squash-merged PR #${pr.number}.`);

                // Automatically delete the merged feature branch
                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `heads/${headBranch}`
                  });
                  core.info(`Deleted merged branch '${headBranch}'.`);
                } catch (delErr) {
                  core.warning(`Could not delete branch '${headBranch}': ${delErr.message}`);
                }
              } catch (mergeErr) {
                core.warning(`Auto-merge skipped for PR #${pr.number}: ${mergeErr.message}`);
              }
            }
