name: .NET CI & Automated Testing Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test (.NET 10 Microservices)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK (10.0)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: |
        dotnet restore src/BuildingBlocks/Common/NET-Tutos.BuildingBlocks.Common.csproj
        dotnet restore src/BuildingBlocks/EventBus/NET-Tutos.BuildingBlocks.EventBus.csproj
        dotnet restore src/Services/CodeRunner/NET-Tutos.CodeRunner.API/NET-Tutos.CodeRunner.API.csproj
        dotnet restore src/Services/Gamification/NET-Tutos.Gamification.API/NET-Tutos.Gamification.API.csproj
        dotnet restore web/web.csproj
        dotnet restore tests/NET-Tutos.UnitTests/NET-Tutos.UnitTests.csproj
        dotnet restore tests/NET-Tutos.IntegrationTests/NET-Tutos.IntegrationTests.csproj
        dotnet restore tests/NET-Tutos.CodeRunner.Tests/NET-Tutos.CodeRunner.Tests.csproj
        dotnet restore tests/NET-Tutos.Gamification.Tests/NET-Tutos.Gamification.Tests.csproj

    - name: Build Projects
      run: |
        dotnet build src/BuildingBlocks/Common/NET-Tutos.BuildingBlocks.Common.csproj --configuration Release --no-restore
        dotnet build src/BuildingBlocks/EventBus/NET-Tutos.BuildingBlocks.EventBus.csproj --configuration Release --no-restore
        dotnet build src/Services/CodeRunner/NET-Tutos.CodeRunner.API/NET-Tutos.CodeRunner.API.csproj --configuration Release --no-restore
        dotnet build src/Services/Gamification/NET-Tutos.Gamification.API/NET-Tutos.Gamification.API.csproj --configuration Release --no-restore
        dotnet build web/web.csproj --configuration Release --no-restore
        dotnet build tests/NET-Tutos.UnitTests/NET-Tutos.UnitTests.csproj --configuration Release --no-restore
        dotnet build tests/NET-Tutos.IntegrationTests/NET-Tutos.IntegrationTests.csproj --configuration Release --no-restore
        dotnet build tests/NET-Tutos.CodeRunner.Tests/NET-Tutos.CodeRunner.Tests.csproj --configuration Release --no-restore
        dotnet build tests/NET-Tutos.Gamification.Tests/NET-Tutos.Gamification.Tests.csproj --configuration Release --no-restore

    - name: Run Microservice Gamification Tests
      run: |
        dotnet test tests/NET-Tutos.Gamification.Tests/NET-Tutos.Gamification.Tests.csproj \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults/GamificationTests

    - name: Run Microservice CodeRunner Tests
      run: |
        dotnet test tests/NET-Tutos.CodeRunner.Tests/NET-Tutos.CodeRunner.Tests.csproj \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults/CodeRunnerTests

    - name: Run Unit Tests with Code Coverage
      run: |
        dotnet test tests/NET-Tutos.UnitTests/NET-Tutos.UnitTests.csproj \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults/UnitTests

    - name: Run Integration Tests with Code Coverage
      run: |
        dotnet test tests/NET-Tutos.IntegrationTests/NET-Tutos.IntegrationTests.csproj \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults/IntegrationTests

    - name: Upload Test Results Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-and-coverage
        path: ./TestResults
        retention-days: 14
