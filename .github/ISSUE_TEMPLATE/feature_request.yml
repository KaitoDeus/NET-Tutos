name: "✨ Đề xuất tính năng / Bài học mới (Feature Request)"
description: "Đề xuất tính năng mới, Microservice mới hoặc chủ đề bài giảng .NET 10 / C# 14"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: "Hạng mục đề xuất"
      options:
        - "Học liệu & Bài giảng mới (.NET 10 / C# 14)"
        - "Roslyn C# Online Sandbox / In-Lesson Code Lab"
        - "Atus AI Tutor & Phỏng vấn giả lập"
        - "Kiến trúc Microservices, Redis Cache & DevOps"
        - "SEO & Đa ngôn ngữ (Geo-IP)"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Chi tiết đề xuất"
      placeholder: "Mô tả lợi ích và cách hoạt động mong muốn..."
    validations:
      required: true
