name: "✨ Feature / Curriculum Request"
description: "Propose a new feature, microservice capability, or .NET 10 / C# 14 curriculum lesson"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: "Proposal Category"
      options:
        - "New Curriculum & Tutorials (.NET 10 / C# 14)"
        - "Roslyn C# Online Sandbox / In-Lesson Code Lab"
        - "Atus AI Tutor & Mock Technical Interview"
        - "Microservices Architecture, Redis Cache & DevOps"
        - "SEO & Localization (Geo-IP)"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposal Details"
      placeholder: "Describe the expected benefits, workflow, and acceptance criteria..."
    validations:
      required: true
