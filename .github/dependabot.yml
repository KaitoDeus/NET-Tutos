version: 2
updates:
  # Automatically open weekly Pull Requests for .NET 10 NuGet package updates
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "dotnet-10"
      - "auto-pr"

  # Automatically open weekly Pull Requests for Docker base image updates (PostgreSQL, Redis, RabbitMQ, .NET SDK)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
      - "auto-pr"

  # Automatically open weekly Pull Requests for GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
      - "auto-pr"
